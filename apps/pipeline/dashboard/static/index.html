<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBPC pipeline</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
 <header class="bar">
  <b class="brand">BBPC pipeline</b>
  <span class="sp"></span>
  <span class="pill mono" id="data-dir" title="Pipeline data directory"></span>
  <span class="pill" title="Checking the Convex target runs the Node importer. It belongs to the Runs tab, which is not built yet."><i class="dot no"></i>Convex target <span id="convex">not checked</span></span>
  <span class="pill" title="This dashboard only reads. It writes no file and starts no process."><i class="dot ok"></i>Read-only</span>
 </header>
 <nav class="tabs" id="tabs">
  <a href="#today" data-tab="today">Today<span class="n" id="needs-count" hidden></span></a>
  <a href="#episode" data-tab="episode" id="episode-tab">Episode</a>
  <span class="off" title="Not built yet">Clips</span>
  <span class="off" title="Not built yet">Shirts</span>
  <span class="off" title="Not built yet">Lab</span>
  <span class="off" title="Not built yet">Runs</span>
  <a href="#settings" data-tab="settings">Settings</a>
 </nav>
 <main id="view"><p class="mut">Loading…</p></main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
