name: Deploy staging

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbpc-convex-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and package
        run: |
          npm run check
          npm run package:check

      - name: Deploy backward-compatible backend
        run: >-
          npx convex deploy
          --typecheck enable
          --message "GitHub staging ${GITHUB_SHA}"

      - name: Verify deployed public contract
        run: |
          npm run contract:generate -- --prod
          npm run contract:build
          git diff --exit-code -- contracts/convexApi.ts contracts/generated
