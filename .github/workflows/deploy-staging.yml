name: Deploy staging

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbpc-convex-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}
      BBPC_EXPECTED_CONVEX_DEPLOYMENT: merry-shepherd-928
      BBPC_FORBIDDEN_CONVEX_DEPLOYMENT: determined-wombat-872
      BBPC_EXPECTED_ENVIRONMENT: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify staging deploy target
        run: npm run deploy:target:check

      - name: Verify staging environment
        run: npm run deploy:environment:check

      - name: Verify source and package
        run: |
          npm run check
          npm run package:check

      - name: Deploy backward-compatible backend
        run: >-
          npx convex deploy
          --typecheck enable
          --message "GitHub staging ${GITHUB_SHA}"

      - name: Verify deployed public contract
        run: |
          npm run contract:generate
          npm run contract:build
          git diff --exit-code -- contracts/convexApi.ts contracts/generated
