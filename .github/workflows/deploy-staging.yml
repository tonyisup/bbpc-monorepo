name: Deploy Convex staging

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-staging.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/convex-backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbpc-convex-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    defaults:
      run:
        working-directory: packages/convex-backend
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}
      BBPC_EXPECTED_CONVEX_DEPLOYMENT: merry-shepherd-928
      BBPC_FORBIDDEN_CONVEX_DEPLOYMENT: determined-wombat-872
      BBPC_EXPECTED_ENVIRONMENT: staging
      BBPC_EXPECTED_STAGING_STATE: S3
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Verify staging deploy target
        run: pnpm run deploy:target:check

      - name: Verify staging environment
        run: pnpm run deploy:environment:check

      - name: Verify source and workspace contract
        run: |
          pnpm run check
          pnpm run package:check

      - name: Deploy backward-compatible backend
        run: >-
          npx convex deploy
          --typecheck enable
          --message "GitHub staging ${GITHUB_SHA}"

      - name: Verify deployed staging invariants
        run: pnpm run deploy:staging:verify

      - name: Verify deployed public contract
        run: |
          npx convex-helpers ts-api-spec --output-file "$RUNNER_TEMP/convexApi.deployed.ts"
          pnpm run contract:compare contracts/convexApi.ts "$RUNNER_TEMP/convexApi.deployed.ts"
