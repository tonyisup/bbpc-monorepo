name: Pipeline

on:
  pull_request:
    paths:
      - ".github/workflows/pipeline.yml"
      - "apps/pipeline/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pipeline.yml"
      - "apps/pipeline/**"

permissions:
  contents: read

jobs:
  test:
    # The pipeline only runs on the podcast Mac: its captions use macOS system fonts.
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/pipeline
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            apps/pipeline/requirements-test.txt
            apps/pipeline/constraints.txt

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt -c constraints.txt

      - name: Test the pipeline
        run: python -m pytest tests -q
